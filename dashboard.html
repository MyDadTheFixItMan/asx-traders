<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="600">
<title>ASX Paper Trader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#667085;--line:#e4e7ec;
--up:#0f8a4b;--down:#c8322b;--accent:#2f5bea;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#e7e9ee;
--muted:#98a2b3;--line:#272c36;--up:#3ccf86;--down:#ff6b61;--accent:#7b9bff;--chip:#1e2433}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:0 0 12px}
.muted{color:var(--muted)}
.banner{margin:12px 0 20px;padding:10px 14px;border-radius:10px;background:var(--chip);
color:var(--muted);font-size:13px}
.alert{display:none;margin:12px 0;padding:12px 14px;border-radius:10px;font-weight:600;
background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down);
border:1px solid var(--down)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:22px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)}
.section{margin-top:16px}
.two{display:grid;gap:12px;grid-template-columns:2fr 1fr}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--text);
padding:5px 12px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}
td.reason{text-align:left;white-space:normal;color:var(--muted);min-width:260px;font-size:13px}
.side{font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px}
.side.BUY{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.side.SELL{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down)}
.empty{color:var(--muted);padding:16px 0;text-align:center}
.chartbox{position:relative;height:280px}
a{color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;
border-radius:999px;cursor:pointer;font:inherit}
.btn:disabled{opacity:.6;cursor:wait}
.actions{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <span class="muted">Updated <span id="updated"></span> (<span id="city"></span> time) · checks <span id="checks"></span> on GitHub</span>
  </header>
  <div class="actions"><button class="btn" id="updateBtn" type="button">&#8635; Update now</button>
    <span class="muted" id="updateNote"></span></div>
  <div class="alert" id="staleAlert" role="alert"></div>
  <div class="banner">Simulated trading only, with no real money. Prices come from Yahoo Finance
    and <span id="delayNote"></span>. Includes <span id="feeNote"></span> brokerage per trade<span id="slipNote"></span>.
    <span id="marketNote"></span></div>

  <div class="grid" id="stats"></div>

  <div class="two section">
    <div class="card">
      <h2>Portfolio value (every check)</h2>
      <div class="chartbox"><canvas id="equityChart"></canvas></div>
    </div>
    <div class="card">
      <h2>Profit / loss by period</h2>
      <div class="tabs" id="periodTabs">
        <button data-k="daily" class="on">Daily</button>
        <button data-k="weekly">Weekly</button>
        <button data-k="monthly">Monthly</button>
      </div>
      <div class="chartbox" style="height:200px"><canvas id="periodChart"></canvas></div>
      <div class="scroll"><table id="periodTable"></table></div>
    </div>
  </div>

  <div class="card section">
    <h2>Shares held now</h2>
    <div class="scroll"><table id="positions"></table></div>
  </div>

  <div class="card section">
    <h2>Daily review: why the portfolio moved</h2>
    <div class="scroll"><table id="reviews"></table></div>
    <ul class="muted" id="reviewNotes"></ul>
  </div>

  <div class="card section">
    <h2>Trade history (newest first)</h2>
    <div class="scroll"><table id="trades"></table></div>
  </div>

  <p class="muted section" id="rules"></p>
</div>

      : `Update failed${e.message ? ": " + e.message : ""}. Close this page and reopen the desktop icon.`;
  }
};
$("feeNote").textContent = money(D.rules.brokerage_per_trade);
$("slipNote").textContent = D.rules.slippage_pct ? ` plus a ${D.rules.slippage_pct}% price gap each way` : "";
if (D.market && D.market.filter_on) {
  $("marketNote").innerHTML = D.market.ok
    ? `<br>Market filter: ${MK.index_name} (${D.market.index.toLocaleString("en-AU")}) is above its 200-day average, so new buys are allowed.`
    : `<br><b>Market filter: ${MK.index_name} (${D.market.index.toLocaleString("en-AU")}) is below its 200-day average, so new buys are paused.</b>`;
}

const S = D.summary;
const goalPct = Math.round(S.week / S.weekly_goal * 100);
const stats = [
  ["Weekly goal", `${goalPct}%`, `This week ${signed(S.week)} of ${money(S.weekly_goal)} target` +
    `<div class="bar"><span style="width:${Math.max(0, Math.min(100, goalPct))}%"></span></div>`, cls(S.week)],
  ["Portfolio value", money(S.equity), `Started with ${money(S.start)}`, ""],
  ["Total profit / loss", signed(S.total), `${S.total_pct > 0 ? "+" : ""}${S.total_pct}%`, cls(S.total)],
  ["Today", signed(S.today), "since yesterday's close", cls(S.today)],
  ["This month", signed(S.month), "since the 1st", cls(S.month)],
  ["Cash", money(S.cash), `${money(S.holdings)} in shares`, ""],
  ["Trades", S.trades, S.win_rate === null ? "no sales yet" : `${S.win_rate}% of sales profitable`, ""],
  ["Fees paid", money(S.fees), `Realised P/L ${signed(S.realised)}`, ""],
];
$("stats").innerHTML = stats.map(([l, v, s, c]) =>
  `<div class="card stat"><div class="label">${l}</div><div class="value ${c}">${v}</div><div class="sub muted">${s}</div></div>`).join("");

// positions
$("positions").innerHTML = D.positions.length ? `
  <tr><th>Code</th><th>Shares</th><th>Bought at</th><th>Total paid</th><th>Price now</th><th>Value</th><th>Profit / loss</th><th>Stop</th><th>Bought</th></tr>` +
  D.positions.map(p => `<tr><td>${yahooLink(p.code)}</td><td>${p.qty}</td><td>${money(p.bought_at)}</td><td>${money(p.paid)}</td>
    <td>${money(p.price)}</td><td>${money(p.value)}</td>
    <td class="${cls(p.upl)}">${signed(p.upl)} (${p.upl_pct > 0 ? "+" : ""}${p.upl_pct}%)</td>
    <td>${p.stop ? money(p.stop) : "-"}</td><td>${when(p.opened)}</td></tr>`).join("")
  : `<tr><td class="empty">No shares held. All cash.</td></tr>`;

// trades
$("trades").innerHTML = D.trades.length ? `
  <tr><th>Time</th><th>Action</th><th>Code</th><th>Shares</th><th>Price</th><th>Value</th><th>Profit / loss</th><th style="text-align:left">Why</th></tr>` +
  D.trades.map(t => `<tr><td>${when(t.ts)}</td><td><span class="side ${t.side}">${t.side}</span></td>
    <td>${yahooLink(t.code)}</td><td>${t.qty}</td><td>${money(t.price)}</td><td>${money(t.qty * t.price)}</td>
    <td class="${cls(t.realised_pnl)}">${t.realised_pnl === null ? "" : signed(t.realised_pnl)}</td>
    <td class="reason">${t.reason}</td></tr>`).join("")
  : `<tr><td class="empty">No trades yet.</td></tr>`;

const R = D.rules;
const ST = D.strategy;
const sells = [`its stop (${ST.use_atr_stops ? `${ST.atr_stop_mult}x its normal daily move, ${ST.min_stop_pct}-${ST.max_stop_pct}%` : `-${R.stop_loss_pct}%`})`];
if (R.take_profit_pct < 100) sells.push(`+${R.take_profit_pct}% profit (allowed the same day)`);
if (R.sell_when_rsi_above <= 100) sells.push(`RSI above ${R.sell_when_rsi_above}`);
if (R.max_hold_days < 365) sells.push(`after ${R.max_hold_days} days`);
if (ST.sell_below_sma50) sells.push("a fall below the 50-day average");
$("rules").innerHTML = `Rules: buy ${MK.index_name} stocks scoring ${R.min_buy_score}+ ` +
  `(${ST.mode === "momentum" ? "strong momentum vs the index, in an uptrend" : "classic oversold signals"}` +
  `${ST.use_market_filter ? `, only while the ${MK.index_name} is above its 200-day average` : ""}` +
  `${ST.use_event_filter ? `, skipping stocks with a dividend or results date in the next ${ST.event_days} days` : ""}` +
  `${ST.use_quality_filter ? `, only profitable companies with ROE of ${ST.min_roe_pct}%+ and low debt` : ""}` +
  `${ST.max_per_sector ? `, at most ${ST.max_per_sector} stock${ST.max_per_sector > 1 ? "s" : ""} per sector` : ""}` +
  `${ST.max_5d_gain_pct ? `, not after a ${ST.max_5d_gain_pct}%+ jump in 5 days` : ""}` +
  `${ST.max_below_high_pct ? `, within ${ST.max_below_high_pct}% of the 52-week high` : ""}` +
  `${ST.skip_bearish_candle ? ", not on a bearish engulfing candle" : ""}` +
  `${ST.max_lottery_pct ? `, not after extreme one-day spikes (top 5 daily gains in a month averaging over ${ST.max_lottery_pct}%)` : ""}` +
  `${ST.max_share_growth_pct ? `, not companies that grew their share count over ${ST.max_share_growth_pct}% last year` : ""}). ` +
  `${ST.pyramid_trigger_r ? `Buy ${Math.round((ST.pyramid_size ?? 0.5) * 100)}% more of a holding once it is up ` +
    `${ST.pyramid_trigger_r}x its stop distance, then raise its stop to the buy price. ` : ""}` +
  `${ST.drawdown_cut_pct ? `New trades are halved while the account is ${ST.drawdown_cut_pct}%+ below its peak. ` : ""}` +
  `Invest up to ${money(R.invest_amount)} in about ${money(R.target_trade_value)} lots, then the reserve ` +
  `(max ${money(R.reserve_trade_max)} each). Sell at ${sells.join(", ")}. ` +
  `Goal: +${R.weekly_target_pct}% a week. Change these in ${MK.config}.` +
  (D.has_backtest ? ` <a href="backtest.html">See how these rules did on past data &rarr;</a>` : "") +
  (D.has_changes ? ` <a href="reports/strategy_changes.html">Rule changes and why &rarr;</a>` : "");

// daily reviews, newest first
const pct = v => v === null ? "-" : `${v > 0 ? "+" : ""}${v.toFixed(2)}%`;
$("reviews").innerHTML = D.reviews.length ? `
  <tr><th>Day</th><th>Portfolio</th><th>${MK.index_name}</th><th>Market's share</th><th>Picking and costs</th><th>Brokerage</th><th>Trades</th><th>Full review</th></tr>` +
  D.reviews.map(r => `<tr><td>${r.date}</td><td class="${cls(r.change)}">${signed(r.change)} (${pct(r.change_pct)})</td>
    <td class="${cls(r.index_pct)}">${pct(r.index_pct)}</td><td class="${cls(r.market_part)}">${signed(r.market_part)}</td>
    <td class="${cls(r.change - r.market_part)}">${signed(r.change - r.market_part)}</td><td>${money(r.fees)}</td>
    <td>${r.buys + r.sells}</td><td><a href="${MK.reports}/daily/${r.date}.html">Open</a></td></tr>`).join("")
  : `<tr><td class="empty">The first review is written after 4pm on a trading day.</td></tr>`;
$("reviewNotes").innerHTML = D.reviews.length ? D.reviews[0].notes.map(n => `<li>${safe(n)}</li>`).join("") : "";

// charts
if (window.Chart) {
  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--line");
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

  new Chart($("equityChart"), {
    type: "line",
    data: {
      labels: D.equity_series.map(p => p[0]),
      datasets: [
        {label: "Portfolio value", data: D.equity_series.map(p => p[1]), borderColor: css("--accent"),
         backgroundColor: css("--accent"), borderWidth: 2, tension: .2,
         pointRadius: D.equity_series.length < 40 ? 3 : 0},
        {label: "Starting cash", data: D.equity_series.map(() => S.start), borderColor: css("--muted"),
         borderDash: [4, 4], borderWidth: 1, pointRadius: 0},
      ],
    },
    options: {maintainAspectRatio: false, interaction: {mode: "index", intersect: false},
      plugins: {legend: {display: false}, tooltip: {callbacks: {label: c => `${c.dataset.label}: ${money(c.parsed.y)}`}}},
      scales: {x: {ticks: {maxTicksLimit: 8}}, y: {ticks: {callback: v => money(v)}}}},
  });
}

let periodChart;
function showPeriod(k) {
  document.querySelectorAll("#periodTabs button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
  const rows = D[k];
  const label = {daily: "Day", weekly: "Week ending", monthly: "Month"}[k];
  const fmt = p => k === "monthly" ? new Date(p).toLocaleString("en-AU", {month: "short", year: "numeric"}) : p;
  const goal = k === "weekly";
  $("periodTable").innerHTML = rows.length ? `<tr><th>${label}</th><th>Value</th><th>Change</th>${goal ? "<th>Goal</th>" : ""}</tr>` +
    rows.slice(0, 12).map(r => `<tr><td>${fmt(r.period)}</td><td>${money(r.equity)}</td>
      <td class="${cls(r.change)}">${signed(r.change)} (${r.pct > 0 ? "+" : ""}${r.pct}%)</td>
      ${goal ? `<td class="${r.change >= S.weekly_goal ? "up" : "muted"}">${r.change >= S.weekly_goal ? "Hit" : "Missed"}</td>` : ""}</tr>`).join("")
    : `<tr><td class="empty">No history yet.</td></tr>`;
  if (!window.Chart) return;
  const series = rows.slice(0, 30).reverse();
  periodChart?.destroy();
  periodChart = new Chart($("periodChart"), {
    type: "bar",
    data: {labels: series.map(r => fmt(r.period)),
      datasets: [{data: series.map(r => r.change), borderRadius: 4,
        backgroundColor: series.map(r => r.change >= 0 ? css("--up") : css("--down"))}]},
    options: {maintainAspectRatio: false, plugins: {legend: {display: false},
      tooltip: {callbacks: {label: c => signed(c.parsed.y)}}},
      scales: {y: {ticks: {callback: v => money(v)}}}},
  });
}
document.querySelectorAll("#periodTabs button").forEach(b => b.onclick = () => showPeriod(b.dataset.k));
showPeriod("daily");
</script>
</body>
</html>
