<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#667085;--line:#e4e7ec;
--up:#0f8a4b;--down:#c8322b;--accent:#2f5bea;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#e7e9ee;
--muted:#98a2b3;--line:#272c36;--up:#3ccf86;--down:#ff6b61;--accent:#7b9bff;--chip:#1e2433}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:0 0 12px}
.muted{color:var(--muted)}
.banner{margin:12px 0 20px;padding:10px 14px;border-radius:10px;background:var(--chip);
color:var(--muted);font-size:13px}
.alert{display:none;margin:12px 0;padding:12px 14px;border-radius:10px;font-weight:600;
background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down);
border:1px solid var(--down)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:22px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)}
.section{margin-top:16px}
.two{display:grid;gap:12px;grid-template-columns:2fr 1fr}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--text);
padding:5px 12px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}
td.reason{text-align:left;white-space:normal;color:var(--muted);min-width:260px;font-size:13px}
.side{font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px}
.side.BUY{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.side.SELL{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down)}
.empty{color:var(--muted);padding:16px 0;text-align:center}
.chartbox{position:relative;height:280px}
a{color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;
border-radius:999px;cursor:pointer;font:inherit}
.btn:disabled{opacity:.6;cursor:wait}
.actions{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
</style>
</head>

  </div>

    <ul class="muted" id="reviewNotes"></ul>

  <div class="card section">
    <h2>Trade history (newest first)</h2>
    <div class="scroll"><table id="trades"></table></div>
  </div>

  <p class="muted section" id="rules"></p>
</div>

    rows.slice(0, 12).map(r => `<tr><td>${fmt(r.period)}</td><td>${money(r.equity)}</td>
      <td class="${cls(r.change)}">${signed(r.change)} (${r.pct > 0 ? "+" : ""}${r.pct}%)</td>
      ${goal ? `<td class="${r.change >= S.weekly_goal ? "up" : "muted"}">${r.change >= S.weekly_goal ? "Hit" : "Missed"}</td>` : ""}</tr>`).join("")
    : `<tr><td class="empty">No history yet.</td></tr>`;
  if (!window.Chart) return;
  const series = rows.slice(0, 30).reverse();
  periodChart?.destroy();
  periodChart = new Chart($("periodChart"), {
    type: "bar",
    data: {labels: series.map(r => fmt(r.period)),
      datasets: [{data: series.map(r => r.change), borderRadius: 4,
        backgroundColor: series.map(r => r.change >= 0 ? css("--up") : css("--down"))}]},
    options: {maintainAspectRatio: false, plugins: {legend: {display: false},
      tooltip: {callbacks: {label: c => signed(c.parsed.y)}}},
      scales: {y: {ticks: {callback: v => money(v)}}}},
  });
}
document.querySelectorAll("#periodTabs button").forEach(b => b.onclick = () => showPeriod(b.dataset.k));
showPeriod("daily");
</script>
</body>
</html>
