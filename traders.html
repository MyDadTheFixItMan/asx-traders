<!doctype html>
<!-- One page for all four simulated traders (ASX and US). Opened by the "ASX Paper Trader"
     desktop icon (open_dashboard.pyw). The Day Trader tab shows the separate
     Day Trader in the same layout (daytrader.html, built by dashboard.py from
     that bot's public data); nothing here changes that project. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASX Traders</title>
<meta name="apple-mobile-web-app-title" content="Traders">
<meta name="theme-color" content="#ffffff">
<style>
  :root { --bg:#f6f7f9; --bar:#ffffff; --text:#1f2328; --muted:#5b6370; --line:#e3e6ea; --accent:#4f5bd5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --bar:#1e2126; --text:#e6e8eb; --muted:#9aa1ab; --line:#2e333a; --accent:#8b94ff; }
  }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  nav { display:flex; align-items:center; gap:4px; padding:0 16px; overflow-x:auto; background:var(--bar);
    border-bottom:1px solid var(--line); }
  nav button { white-space:nowrap; font:inherit; font-size:15px; background:none; border:0; color:var(--muted);
    padding:12px 16px; cursor:pointer; border-bottom:3px solid transparent; }
  nav button:hover { color:var(--text); }
  nav button[aria-selected="true"] { color:var(--text); font-weight:600; border-bottom-color:var(--accent); }
  nav .spacer { flex:1; }
  nav #refresh { font-size:13px; padding:6px 12px; border:1px solid var(--line); border-radius:6px; }
  main { flex:1; position:relative; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  iframe[hidden] { display:none; }
</style>
</head>
<body>
<nav role="tablist">
  <button role="tab" id="tab-paper" aria-controls="paper">ASX Paper Trader</button>
  <button role="tab" id="tab-day" aria-controls="day">ASX Day Trader</button>
  <button role="tab" id="tab-uspaper" aria-controls="uspaper">US Paper Trader</button>
  <button role="tab" id="tab-usday" aria-controls="usday">US Day Trader</button>
</nav>
<main>
  <iframe id="paper" title="ASX Paper Trader" src="dashboard.html"></iframe>
  <iframe id="day" title="ASX Day Trader" src="daytrader.html"></iframe>
  <iframe id="uspaper" title="US Paper Trader" src="us_dashboard.html"></iframe>
  <iframe id="usday" title="US Day Trader" src="us_daytrader.html"></iframe>
</main>
<script>
  const tabs = { paper: "tab-paper", day: "tab-day", uspaper: "tab-uspaper", usday: "tab-usday" };
  let current = "paper";
  function show(name) {
    current = name;
    for (const [frame, tab] of Object.entries(tabs)) {
      document.getElementById(frame).hidden = frame !== name;
      document.getElementById(tab).setAttribute("aria-selected", frame === name);
    }
    try { localStorage.setItem("asxTab", name); } catch (e) {}
  }
  for (const [frame, tab] of Object.entries(tabs)) document.getElementById(tab).onclick = () => show(frame);
  let saved = "paper";
  try { saved = localStorage.getItem("asxTab") || "paper"; } catch (e) {}
  show(tabs[saved] ? saved : "paper");
</script>
</body>
</html>
